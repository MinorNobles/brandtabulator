name: Weekly run

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      category:
        description: "Category slug"
        default: "watch-manufacturers"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run category
        env:
          BT_CONTACT: ${{ vars.BT_CONTACT || 'https://github.com/MinorNobles/brandtabulator' }}
        run: python3 scripts/run_category.py "${{ github.event.inputs.category || 'watch-manufacturers' }}"
      - name: Commit results
        run: |
          git config user.name "brandtabulator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Weekly run: $(date -u +%F)"
          git push
